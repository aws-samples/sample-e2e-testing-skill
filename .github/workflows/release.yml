# タグの push で配布用 zip(README・LICENSE・THIRD-PARTY-LICENSES・スキル一式。`pnpm run archive` と同じ)を作り、
# GitHub Release にアセットとして添付する。リリース名はタグ名。
# archive スクリプトはシェルと git だけで依存を使わないので、pnpm を入れずに npm で実行する
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run archive
        env:
          ARCHIVE_VERSION: ${{ github.ref_name }}
      - run: |
          cat > notes.md <<EOF
          ## インストール

          1. 下の Assets から \`sample-e2e-testing-skill-${TAG}.zip\` をダウンロードして展開します
          2. zip を展開した場所(\`sample-e2e-testing-skill\` ディレクトリができた場所)で、次のコマンドを実行します

             \`\`\`
             npx skills add ./sample-e2e-testing-skill/skills/e2e-testing -g
             \`\`\`
          EOF
          gh release create "$TAG" dist/*.zip --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
